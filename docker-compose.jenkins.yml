# Jenkins
  jenkins:
    image: jenkins/jenkins:lts
    container_name: taskflow-jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - taskflow-network

  # SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: taskflow-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL     : jdbc:postgresql://postgres:5432/taskflow
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: taskflow2026
    depends_on:
      - postgres
    networks:
      - taskflow-network

volumes:
  jenkins_home:
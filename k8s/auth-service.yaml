apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: taskflow-auth:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          value: "postgresql://taskflow_user:taskflow_pass@postgres:5432/taskflow"
        - name: JWT_SECRET
          value: "taskflow_super_secret_key"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taskflow
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001